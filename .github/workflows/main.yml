name: CI TRASHURY

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  repo-check:
    name: Cek struktur repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Pastikan dokumentasi wajib ada
        run: |
          test -f README.md || { echo "::error::README.md tidak ditemukan"; exit 1; }
          test -d docs || { echo "::error::Folder docs (GitHub Page) tidak ditemukan"; exit 1; }
          echo "Struktur dokumentasi lengkap."

  build:
    name: Build aplikasi C#
    runs-on: windows-latest
    needs: repo-check
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Cek apakah solution sudah ada
        id: detect
        shell: bash
        run: |
          solution=$(ls *.sln 2>/dev/null | head -1)
          if [ -n "$solution" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "solution=$solution" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Berkas solution belum ada, build dilewati."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependency
        if: steps.detect.outputs.exists == 'true'
        run: dotnet restore ${{ steps.detect.outputs.solution }}

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: dotnet build ${{ steps.detect.outputs.solution }} --configuration Release --no-restore

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: dotnet test ${{ steps.detect.outputs.solution }} --configuration Release --no-build --verbosity normal
