name: CI TRASHURY

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FRONTEND_DIR: frontend   # ubah jika folder kode PWA kalian berbeda
  NODE_VERSION: "22"

jobs:
  repo-check:
    name: Cek struktur repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Pastikan dokumentasi wajib ada
        run: |
          test -f README.md || { echo "::error::README.md tidak ditemukan"; exit 1; }
          test -d docs || { echo "::error::Folder docs (GitHub Page) tidak ditemukan"; exit 1; }
          echo "Struktur dokumentasi lengkap."

  frontend-build:
    name: Lint dan build frontend PWA
    runs-on: ubuntu-latest
    needs: repo-check
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Cek apakah kode frontend sudah ada
        id: detect
        run: |
          if [ -f "$FRONTEND_DIR/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$FRONTEND_DIR/package.json belum ada, build dilewati."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependency
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint --if-present

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build --if-present
